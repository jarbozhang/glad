name: Build Desktop Apps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/tauri-desktop-build.yml"
      - "packages/happy-app/**"
      - "packages/happy-wire/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
            artifact-name: bfelab-macos-aarch64
            artifact-path: |
              packages/happy-app/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app
              packages/happy-app/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
            artifact-name: bfelab-macos-x64
            artifact-path: |
              packages/happy-app/src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.app
              packages/happy-app/src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg
          - name: Windows
            os: windows-latest
            args: ""
            rust-target: ""
            artifact-name: bfelab-windows
            artifact-path: |
              packages/happy-app/src-tauri/target/release/bundle/**/*.msi
              packages/happy-app/src-tauri/target/release/bundle/**/*.exe
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust-target: ""
            artifact-name: bfelab-linux
            artifact-path: |
              packages/happy-app/src-tauri/target/release/bundle/**/*.AppImage
              packages/happy-app/src-tauri/target/release/bundle/**/*.deb
              packages/happy-app/src-tauri/target/release/bundle/**/*.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/happy-app/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean stale desktop bundles
        shell: bash
        run: |
          find packages/happy-app/src-tauri/target -path "*/release/bundle" -type d -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          APP_ENV: production
          APP_TARGET: desktop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/happy-app
          tauriScript: pnpm exec tauri
          args: ${{ matrix.args }}

      - name: Verify production branding
        shell: bash
        run: |
          set -euo pipefail

          artifact_matches=$(
            find packages/happy-app/src-tauri/target \
              \( -path "*/release/bundle/macos/*.app" \
              -o -path "*/release/bundle/dmg/*.dmg" \
              -o -path "*/release/bundle/nsis/*.exe" \
              -o -path "*/release/bundle/msi/*.msi" \
              -o -path "*/release/bundle/appimage/*.AppImage" \
              -o -path "*/release/bundle/deb/*.deb" \
              -o -path "*/release/bundle/rpm/*.rpm" \) \
              \( -iname "*preview*" -o -iname "*dev*" \) \
              -print
          )

          if [ -n "$artifact_matches" ]; then
            echo "Production desktop bundle artifact names must not contain preview/dev names."
            printf "%s\n" "$artifact_matches"
            exit 1
          fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            while IFS= read -r plist; do
              bundle_name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleName" "$plist" 2>/dev/null || true)
              display_name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$plist" 2>/dev/null || true)

              if printf "%s\n%s\n" "$bundle_name" "$display_name" | grep -Eiq "preview|dev"; then
                echo "Production macOS app metadata must not contain preview/dev names: $plist"
                printf "CFBundleName=%s\nCFBundleDisplayName=%s\n" "$bundle_name" "$display_name"
                exit 1
              fi
            done < <(find packages/happy-app/src-tauri/target -path "*/release/bundle/macos/*.app/Contents/Info.plist")
          fi

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
