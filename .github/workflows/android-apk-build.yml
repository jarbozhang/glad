name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-apk-*"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: packages/happy-app
        env:
          APP_ENV: preview
          NODE_ENV: production
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Disable OTA updates for CI artifact
        working-directory: packages/happy-app
        run: |
          sed -i 's/android:name="expo.modules.updates.ENABLED" android:value="true"/android:name="expo.modules.updates.ENABLED" android:value="false"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/{\&quot;expo-channel-name\&quot;:\&quot;production\&quot;}/{\&quot;expo-channel-name\&quot;:\&quot;preview\&quot;}/' android/app/src/main/AndroidManifest.xml
          grep -n 'expo.modules.updates.ENABLED\|UPDATES_CONFIGURATION_REQUEST_HEADERS_KEY' android/app/src/main/AndroidManifest.xml

      - name: Generate test signing credentials
        working-directory: packages/happy-app
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore android-release.keystore \
            -storepass android \
            -alias androidreleasekey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Happy Preview,O=Happy,C=US"

          cat > credentials.json <<'JSON'
          {
            "android": {
              "keystore": {
                "keystorePath": "android-release.keystore",
                "keystorePassword": "android",
                "keyAlias": "androidreleasekey",
                "keyPassword": "android"
              }
            }
          }
          JSON

      - name: Build APK
        working-directory: packages/happy-app/android
        env:
          APP_ENV: preview
          NODE_ENV: production
          EXPO_NO_TELEMETRY: "1"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m"
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --max-workers=2 \
            :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -x lintVitalAnalyzeRelease \
            -x lintRelease \
            -x lintVitalRelease

      - name: Verify APK
        working-directory: packages/happy-app/android
        run: |
          apk_path="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          build_tools="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --print-certs "$apk_path"

          if unzip -Z1 "$apk_path" | grep -E 'mlkit_barcode_models|play-services-code-scanner|play-services-mlkit|camera-mlkit|react-native-vision-camera|mrousavy'; then
            echo "Unexpected Google barcode or Vision Camera payload found in APK" >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: happy-android-apk
          path: packages/happy-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
