name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-apk-*"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: packages/happy-app
        env:
          APP_ENV: preview
          NODE_ENV: production
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Generate test signing credentials
        working-directory: packages/happy-app
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore android-release.keystore \
            -storepass android \
            -alias androidreleasekey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Happy Preview,O=Happy,C=US"

          cat > credentials.json <<'JSON'
          {
            "android": {
              "keystore": {
                "keystorePath": "android-release.keystore",
                "keystorePassword": "android",
                "keyAlias": "androidreleasekey",
                "keyPassword": "android"
              }
            }
          }
          JSON

      - name: Build APK
        working-directory: packages/happy-app/android
        env:
          APP_ENV: preview
          NODE_ENV: production
          EXPO_NO_TELEMETRY: "1"
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: happy-android-apk
          path: packages/happy-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
